<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e3a6e"/>
      <stop offset="100%" stop-color="#0a1a3c"/>
    </radialGradient>
  </defs>

  <!-- Navy circle background -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>

  <!-- Orbit 1 — tilted ~30deg -->
  <ellipse cx="50" cy="50" rx="34" ry="13"
    fill="none" stroke="rgba(100,180,255,0.55)" stroke-width="1.5"
    transform="rotate(-30 50 50)"/>

  <!-- Orbit 2 — tilted ~90deg (vertical) -->
  <ellipse cx="50" cy="50" rx="34" ry="13"
    fill="none" stroke="rgba(100,180,255,0.55)" stroke-width="1.5"
    transform="rotate(90 50 50)"/>

  <!-- Orbit 3 — tilted ~150deg -->
  <ellipse cx="50" cy="50" rx="34" ry="13"
    fill="none" stroke="rgba(100,180,255,0.55)" stroke-width="1.5"
    transform="rotate(150 50 50)"/>

  <!-- Nucleus -->
  <circle cx="50" cy="50" r="7" fill="#5AC8FA" opacity="0.95"/>
  <circle cx="50" cy="50" r="4" fill="white" opacity="0.9"/>

  <!-- Electrons on each orbit -->
  <!-- Orbit 1 electron -->
  <circle cx="50" cy="37" r="3" fill="#A8D8FF" opacity="0.95"
    transform="rotate(-30 50 50)"/>
  <!-- Orbit 2 electron -->
  <circle cx="50" cy="37" r="3" fill="#A8D8FF" opacity="0.95"
    transform="rotate(90 50 50)"/>
  <!-- Orbit 3 electron -->
  <circle cx="50" cy="63" r="3" fill="#A8D8FF" opacity="0.95"
    transform="rotate(150 50 50)"/>
</svg>
